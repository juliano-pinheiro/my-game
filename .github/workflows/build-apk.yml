name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sincronizar Assets do Jogo
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp style.css android/app/src/main/assets/
          cp game.js android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/

      - name: Compilar APK (Debug)
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/FlyingBird.apk

      - name: Publicar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyingBird-APK
          path: android/app/build/outputs/apk/debug/FlyingBird.apk
          if-no-files-found: error
